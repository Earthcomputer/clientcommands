name: Old Server Client Game Tests
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated server versions to test (leave empty for all)'
        required: false
        default: ''
jobs:
  # splits the server versions between parallel jobs, as testing them all in series takes a long time
  prepare_test_matrix:
    name: Prepare Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.test_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/clientcommands-old-servers
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: ./gradlew writeOldServerTestMatrix ${VERSIONS:+-PoldServerVersions="$VERSIONS"} --stacktrace --no-daemon
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
      - id: test_matrix
        run: echo "matrix=$(cat build/old_server_test_matrix.json)" >> "$GITHUB_OUTPUT"

  old_server_client_gametest:
    name: Old Server Client Game Tests (${{ matrix.versions.name }})
    needs: prepare_test_matrix
    runs-on: ubuntu-latest
    strategy:
      # test the other versions even if some fail
      fail-fast: false
      matrix:
        versions: ${{ fromJson(needs.prepare_test_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/clientcommands-old-servers
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      # the server jars and mappings are cached separately, as they're large and only change when new versions are added.
      # Each job only downloads its own versions, so each job has its own cache
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/clientcommands-old-servers
          key: ${{ runner.os }}-old-servers-${{ matrix.versions.name }}-${{ hashFiles('gradle.properties') }}
          restore-keys: ${{ runner.os }}-old-servers-${{ matrix.versions.name }}-
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ./gradlew runOldServerClientGameTest -PoldServerVersions="$VERSIONS" --stacktrace --no-daemon
        env:
          VERSIONS: ${{ matrix.versions.versions }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: old-server-client-gametest-results-${{ matrix.versions.name }}
          path: |
            build/run/oldServerClientGameTest/logs/
            build/run/oldServerClientGameTest/screenshots/
            build/run/oldServerClientGameTest/servers/*/logs/
