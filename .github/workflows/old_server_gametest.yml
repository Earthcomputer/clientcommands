name: Old Server Client Game Tests
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated server versions to test (leave empty for all)'
        required: false
        default: ''
jobs:
  old_server_client_gametest:
    name: Old Server Client Game Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/clientcommands-old-servers
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      # the server jars and mappings are cached separately, as they're large and only change when new versions are added
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/clientcommands-old-servers
          key: ${{ runner.os }}-old-servers-${{ hashFiles('gradle.properties') }}
          restore-keys: ${{ runner.os }}-old-servers-
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ./gradlew runOldServerClientGameTest ${VERSIONS:+-PoldServerVersions="$VERSIONS"} --stacktrace --no-daemon
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: old-server-client-gametest-results
          path: |
            build/run/oldServerClientGameTest/logs/
            build/run/oldServerClientGameTest/screenshots/
            build/run/oldServerClientGameTest/servers/*/logs/
